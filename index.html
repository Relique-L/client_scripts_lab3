<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Доска публикаций</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Доска публикаций</h1>
        <button id="load">Загрузить публикации</button>
        <form id="postForm">
            <p><input type="text" id="title" placeholder="Заголовок" required></p>
            <p><textarea id="body" placeholder="Текст" required></textarea></p>
            <button type="submit" id="submit">Создать публикацию</button>
        </form>
        <p id="status"></p>
        <ul id="posts"></ul>
        <script src="app.js" defer></script>
    </body>
</html>
